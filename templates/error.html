<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#12100d">
  <title>{% block title %}Something went wrong – Ember{% endblock %}</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #12100d; color: #f1eadd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); text-align: center; padding: 44px 28px; border: 1px solid #383026; border-radius: 20px; background: #1a1712; box-shadow: 0 24px 80px #0006; }
    .code { color: #f2701d; font-size: 13px; font-weight: 800; letter-spacing: .22em; }
    h1 { margin: 14px 0 10px; font-size: clamp(26px, 6vw, 36px); line-height: 1.15; }
    p { color: #b8ad9b; line-height: 1.65; margin: 0 0 26px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 18px; border-radius: 10px; background: #f2701d; color: #1a0e05; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid #f1eadd; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="code">{% block code %}ERROR{% endblock %}</div>
    <h1>{% block heading %}Something went wrong{% endblock %}</h1>
    <p>{% block text %}The page could not be loaded. Please try again.{% endblock %}</p>
    <a href="/">Back to Ember</a>
  </main>
</body>
</html>
